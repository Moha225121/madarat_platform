<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="900" viewBox="0 0 900 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated Laravel assistant robot mascot">
  <title>Laravel Assistant Robot Mascot</title>
  <desc>Transparent animated SVG robot mascot with separate groups for head, body, arms, eyes, antenna, and shadow.</desc>

  <defs>
    <linearGradient id="whitePanel" x1="194" y1="115" x2="669" y2="727" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EEF6FA"/>
      <stop offset="1" stop-color="#D7E7EE"/>
    </linearGradient>

    <linearGradient id="tealGrad" x1="219" y1="180" x2="662" y2="702" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1FF4E8"/>
      <stop offset="1" stop-color="#0899B5"/>
    </linearGradient>

    <linearGradient id="navyGrad" x1="190" y1="140" x2="640" y2="701" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102C46"/>
      <stop offset="1" stop-color="#071827"/>
    </linearGradient>

    <linearGradient id="screenGrad" x1="260" y1="178" x2="651" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123451"/>
      <stop offset="1" stop-color="#061423"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 306) rotate(90) scale(210 330)">
      <stop stop-color="#2DFDF3" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2DFDF3" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#062033" flood-opacity=".22"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      /*
        Laravel-ready animated SVG.
        You can control parts using IDs:
        #robot, #head, #right_arm, #antenna_ball, #eye_left, #eye_right, #mouth
      */

      #robot {
        transform-origin: 450px 470px;
        animation: robotFloat 3.4s ease-in-out infinite;
      }

      #shadow {
        transform-origin: 450px 800px;
        animation: shadowPulse 3.4s ease-in-out infinite;
      }

      #head {
        transform-origin: 450px 305px;
        animation: headTilt 3.4s ease-in-out infinite;
      }

      #right_arm {
        transform-origin: 620px 520px;
        animation: waveHand 2.2s ease-in-out infinite;
      }

      #antenna_ball {
        transform-origin: 450px 100px;
        animation: antennaGlow 1.6s ease-in-out infinite;
      }

      #eye_left, #eye_right {
        transform-origin: center;
        animation: blink 4.8s ease-in-out infinite;
      }

      #mouth {
        transform-origin: center;
        animation: smilePulse 2.8s ease-in-out infinite;
      }

      @keyframes robotFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-18px); }
      }

      @keyframes shadowPulse {
        0%, 100% { transform: scaleX(1); opacity: .26; }
        50% { transform: scaleX(.82); opacity: .13; }
      }

      @keyframes headTilt {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-2.2deg); }
      }

      @keyframes waveHand {
        0%, 100% { transform: rotate(0deg); }
        35% { transform: rotate(-10deg); }
        70% { transform: rotate(7deg); }
      }

      @keyframes antennaGlow {
        0%, 100% { opacity: .82; filter: url(#glow); }
        50% { opacity: 1; filter: url(#glow); }
      }

      @keyframes blink {
        0%, 88%, 100% { transform: scaleY(1); }
        92% { transform: scaleY(.12); }
      }

      @keyframes smilePulse {
        0%, 100% { opacity: .84; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        #robot, #shadow, #head, #right_arm, #antenna_ball, #eye_left, #eye_right, #mouth {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Transparent background intentionally left empty -->

  <ellipse id="shadow" cx="450" cy="797" rx="185" ry="36" fill="#071827" opacity=".22"/>

  <g id="robot" filter="url(#softShadow)">
    <!-- Antenna -->
    <g id="antenna">
      <path d="M450 168V108" stroke="#0B2B43" stroke-width="24" stroke-linecap="round"/>
      <circle id="antenna_ball" cx="450" cy="84" r="30" fill="url(#tealGrad)"/>
      <circle cx="438" cy="72" r="9" fill="#FFFFFF" opacity=".45"/>
    </g>

    <!-- Head -->
    <g id="head">
      <rect x="176" y="166" width="548" height="295" rx="92" fill="url(#whitePanel)"/>
      <rect x="211" y="198" width="478" height="226" rx="67" fill="url(#screenGrad)"/>
      <rect x="211" y="198" width="478" height="226" rx="67" fill="url(#cyanGlow)" opacity=".6"/>
      <path d="M249 206C286 183 361 182 443 184" stroke="#FFFFFF" stroke-opacity=".32" stroke-width="12" stroke-linecap="round"/>
      <rect x="211" y="198" width="478" height="226" rx="67" stroke="#173C57" stroke-width="9"/>

      <!-- Ears -->
      <circle cx="166" cy="312" r="45" fill="url(#tealGrad)"/>
      <circle cx="734" cy="312" r="45" fill="url(#tealGrad)"/>
      <circle cx="166" cy="312" r="30" fill="#0B2B43" opacity=".32"/>
      <circle cx="734" cy="312" r="30" fill="#0B2B43" opacity=".32"/>

      <!-- Face -->
      <g id="eyes" filter="url(#glow)">
        <rect id="eye_left" x="310" y="285" width="82" height="49" rx="24" stroke="#2DFDF3" stroke-width="15"/>
        <rect x="342" y="303" width="24" height="10" rx="5" fill="#2DFDF3"/>
        <rect id="eye_right" x="508" y="285" width="82" height="49" rx="24" stroke="#2DFDF3" stroke-width="15"/>
        <rect x="540" y="303" width="24" height="10" rx="5" fill="#2DFDF3"/>
      </g>

      <path id="mouth" d="M408 358C426 384 477 384 496 358" stroke="#2DFDF3" stroke-width="15" stroke-linecap="round" filter="url(#glow)"/>
    </g>

    <!-- Neck -->
    <g id="neck">
      <rect x="410" y="447" width="80" height="56" rx="24" fill="url(#navyGrad)"/>
    </g>

    <!-- Body -->
    <g id="body">
      <path d="M318 519C318 471 357 432 405 432H495C543 432 582 471 582 519V647C582 696 542 736 493 736H407C358 736 318 696 318 647V519Z" fill="url(#whitePanel)"/>
      <path d="M341 494C356 455 381 432 405 432H495C519 432 544 455 559 494C530 514 495 525 450 525C405 525 370 514 341 494Z" fill="url(#tealGrad)"/>
      <path d="M450 436V725" stroke="#20EDE6" stroke-width="10" stroke-linecap="round" opacity=".75"/>
      <path d="M338 646C382 672 516 672 562 646V672C562 707 533 736 498 736H402C367 736 338 707 338 672V646Z" fill="#0B2B43" opacity=".95"/>
      <path d="M405 432H495C543 432 582 471 582 519V647C582 696 542 736 493 736H407C358 736 318 696 318 647V519C318 471 357 432 405 432Z" stroke="#163A55" stroke-opacity=".28" stroke-width="8"/>
      <circle cx="450" cy="782" r="48" fill="url(#tealGrad)"/>
      <ellipse cx="450" cy="765" rx="58" ry="44" fill="url(#navyGrad)"/>
    </g>

    <!-- Left arm -->
    <g id="left_arm">
      <circle cx="303" cy="521" r="42" fill="url(#tealGrad)"/>
      <rect x="226" y="527" width="74" height="142" rx="35" transform="rotate(18 226 527)" fill="url(#navyGrad)"/>
      <rect x="209" y="642" width="86" height="92" rx="35" transform="rotate(18 209 642)" fill="url(#whitePanel)"/>
      <g transform="translate(219 720) rotate(18)">
        <rect x="0" y="0" width="29" height="65" rx="14" fill="#0B2B43"/>
        <rect x="31" y="-4" width="29" height="72" rx="14" fill="#0B2B43"/>
        <rect x="62" y="4" width="29" height="58" rx="14" fill="#0B2B43"/>
        <circle cx="43" cy="45" r="36" fill="#0B2B43"/>
      </g>
    </g>

    <!-- Right arm with peace sign -->
    <g id="right_arm">
      <circle cx="597" cy="521" r="42" fill="url(#tealGrad)"/>
      <rect x="610" y="502" width="76" height="155" rx="35" transform="rotate(-22 610 502)" fill="url(#navyGrad)"/>
      <circle cx="681" cy="632" r="49" fill="url(#tealGrad)"/>

      <!-- Clean peace hand: simplified and clearer for animation -->
      <g id="peace_hand" transform="translate(680 590) rotate(-10)">
        <!-- Palm -->
        <path
          d="M24 92
             C17 70 28 50 49 45
             C66 41 82 47 91 60
             L100 76
             C107 88 106 105 97 118
             C84 137 55 142 35 129
             C28 124 25 110 24 92Z"
          fill="url(#whitePanel)"
          stroke="#D9E8EF"
          stroke-width="5"
          stroke-linejoin="round"
        />

        <!-- Index finger -->
        <rect
          x="24"
          y="-78"
          width="35"
          height="140"
          rx="17.5"
          transform="rotate(-13 24 -78)"
          fill="url(#whitePanel)"
          stroke="#D9E8EF"
          stroke-width="5"
        />

        <!-- Middle finger -->
        <rect
          x="76"
          y="-65"
          width="35"
          height="130"
          rx="17.5"
          transform="rotate(23 76 -65)"
          fill="url(#whitePanel)"
          stroke="#D9E8EF"
          stroke-width="5"
        />

        <!-- Ring/little folded fingers -->
        <path
          d="M42 72
             C57 87 79 87 94 73
             L103 94
             C86 113 54 115 32 98Z"
          fill="url(#whitePanel)"
          stroke="#D9E8EF"
          stroke-width="5"
          stroke-linejoin="round"
        />

        <!-- Thumb -->
        <path
          d="M29 72
             C11 66 -2 75 -8 91
             C-15 109 -4 124 15 121
             C26 119 33 111 37 101Z"
          fill="url(#whitePanel)"
          stroke="#D9E8EF"
          stroke-width="5"
          stroke-linejoin="round"
        />

        <!-- Small palm smile crease -->
        <path d="M35 108C52 122 80 120 94 103"
              stroke="#D9E8EF"
              stroke-width="5"
              stroke-linecap="round"
              fill="none"/>
      </g>
    </g>
  </g>
</svg>
